# Dependabot: version updates, one weekly batch per ecosystem, grouped so a week is one PR per
# ecosystem instead of one per package. Security updates are switched on in the repository
# settings and arrive separately, as soon as an advisory matches uv.lock.
# Conventional commit prefixes keep release-please's changelog tidy (chore = no release bump).
# Not covered: dbt packages (packages.yml) and pre-commit hooks; bump those by hand.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
      day: monday
    groups:
      providers:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
