name: Bug report
description: Something in the starter does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Not a bug but a security problem? Do not file it here, see
        [SECURITY.md](https://github.com/rootcube/data-mesh-template/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The recipe or command that failed
      description: The `just` recipe or command, and the error it printed.
      render: text
    validations:
      required: true

  - type: textarea
    id: info
    attributes:
      label: Output of `just info`
      description: >
        Tool versions and local setup status. It prints no credentials, but it does print your
        Snowflake context and the path to your key, so redact what you would rather not publish.
      render: text
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.5 / Ubuntu 24.04 / Windows 11
    validations:
      required: true
