# Release flow (docs/reference/git-workflow.md): release-please keeps a release PR up
# to date from the conventional commits on main. Merging that PR bumps pyproject.toml and
# uv.lock, writes CHANGELOG.md, tags vX.Y.Z and creates the GitHub release.
# Tags created with the default GITHUB_TOKEN do not trigger other workflows: anything that
# must run on a release is chained off this job's outputs (release_created, tag_name).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR / tag
    # Inert in a copy of the template, so it never continues upstream's versioning in someone else's
    # repository (docs/start/adopting.md: put your own name here, or drop the workflow).
    if: github.repository == 'rootcube/data-mesh-template'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
