# Release flow (docs/conventions/git-workflow.md): release-please keeps a release PR up
# to date from the conventional commits on main. Merging that PR bumps pyproject.toml and
# uv.lock, writes CHANGELOG.md, tags vX.Y.Z and creates the GitHub release.
# Tags created with the default GITHUB_TOKEN do not trigger other workflows: anything that
# must run on a release is chained off this job's outputs (release_created, tag_name).
# The same rule hits the release pull request itself: opened with GITHUB_TOKEN, it gets no CI
# run, and the `main` ruleset requires the CI checks. workflow_dispatch is the exception to that
# rule, so the last step dispatches CI on the release branch; the check runs land on the pull
# request's head commit under the same job names and satisfy the ruleset. No token needed.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatch CI on the release branch

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

      - name: Run CI on the release pull request
        if: steps.release.outputs.pr
        run: gh workflow run ci.yml --ref "${{ fromJSON(steps.release.outputs.pr).headBranchName }}"
        env:
          GH_TOKEN: ${{ github.token }}
