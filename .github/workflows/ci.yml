name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow dispatches CI on release-please's branch: GitHub runs no workflows for
  # pull requests opened with GITHUB_TOKEN, except through workflow_dispatch.
  workflow_dispatch:

# Read-only token: the jobs only check out and test. Dependabot and fork pull requests get the same.
permissions:
  contents: read

# A new push to the same branch cancels the run still going for the previous one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, ty, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest

  dbt-and-dagster:
    name: dbt parse + Dagster definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run python scripts/dbt_all.py deps --quiet
      - run: uv run python scripts/dbt_all.py parse --target dummy --quiet
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      - run: cd dbt/dbt_example && uv run sqlfluff lint models
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      - run: uv run dagster definitions validate -w workspace.yaml
        env:
          PYTHONWARNINGS: "ignore:Function `definitions_validate_command`"
          DBT_TARGET: dummy
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
          DAGSTER_HOME: ${{ github.workspace }}/.dagster

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run python terraform/config/_validation/validate_configs.py

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --group docs
      - run: uv run --group docs zensical build --strict

  setup:
    # The engineer's path on a fresh machine, on every OS the docs support: `just init` (installs
    # uv when missing, .venv, .env, dbt deps), `just info`, `just check`, a key pair, and one
    # `just start` / `just stop` round trip. The steps run in bash everywhere (Git Bash on
    # Windows); `just` itself runs its recipes in PowerShell there, as on an engineer's machine.
    name: Setup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # No credentials here, so dbt talks to the in-memory DuckDB. `dagster dev` re-parses the dbt
      # project on load, which the Snowflake target cannot survive with an empty SNOWFLAKE_USER.
      # DBT_TARGET is unset in .env, so this reaches dbt; a value .env does set would win over it.
      DBT_TARGET: dummy
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - run: just init
      - run: just info
      - run: just check
      - run: just sf keygen ci
      - name: just start, wait for the UI, just stop
        # Output goes to a file: a background process holding the step's stdout keeps the step alive.
        run: |
          just start > dagster.log 2>&1 &
          for _ in $(seq 1 90); do curl -sf http://127.0.0.1:3000/server_info && break; sleep 2; done
          curl -sf http://127.0.0.1:3000/server_info || { cat dagster.log; exit 1; }
          # The webserver serves /server_info whatever the workspace does, so the log is what proves
          # the code locations loaded. `dagster dev` starts them before it binds the port.
          if grep -q "Error loading repository location" dagster.log; then cat dagster.log; exit 1; fi
          just stop
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:3000/server_info > /dev/null || break; sleep 1; done
          if curl -sf http://127.0.0.1:3000/server_info > /dev/null; then echo "still serving after just stop"; exit 1; fi
