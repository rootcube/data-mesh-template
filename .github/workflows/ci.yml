name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow dispatches CI on release-please's branch: GitHub runs no workflows for
  # pull requests opened with GITHUB_TOKEN, except through workflow_dispatch.
  workflow_dispatch:

# Read-only token: the jobs only check out and test. Dependabot and fork pull requests get the same.
permissions:
  contents: read

# A new push to the same branch cancels the run still going for the previous one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, ty, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest

  dbt-and-dagster:
    name: dbt parse + Dagster definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked
      - run: uv run python scripts/dbt_all.py deps --quiet
      - run: uv run python scripts/dbt_all.py parse --target dummy --quiet
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      - run: cd dbt/dbt_example && uv run sqlfluff lint models
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      - run: uv run dagster definitions validate -w workspace.yaml
        env:
          PYTHONWARNINGS: "ignore:Function `definitions_validate_command`"
          DBT_TARGET: dummy
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
          DAGSTER_HOME: ${{ github.workspace }}/.dagster

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked
      - run: uv run python terraform/config/_validation/validate_configs.py

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked --group docs
      - run: uv run --group docs zensical build --strict
