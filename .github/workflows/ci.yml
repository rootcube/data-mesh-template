name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual rerun from the Actions tab.
  workflow_dispatch:

# Read-only token: the jobs only check out and test. Dependabot and fork pull requests get the same.
permissions:
  contents: read

# A new push to the same branch cancels the run still going for the previous one. Runs on `main`
# finish: every commit there keeps its own result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    # Which parts of the repository a pull request touches, so the jobs below skip what it cannot
    # have broken. A skipped job counts as passed for the ruleset's required checks, where a
    # workflow-level `paths:` filter would leave them pending and block the merge. Pushes to
    # `main`, manual runs and a change to this file check everything, and so does a failure of
    # this job: the other jobs then run instead of skipping.
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.filter.outputs.python }}
      dbt: ${{ steps.filter.outputs.dbt }}
      terraform: ${{ steps.filter.outputs.terraform }}
      docs: ${{ steps.filter.outputs.docs }}
      setup: ${{ steps.filter.outputs.setup }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            files=all
          fi
          if printf '%s\n' "$files" | grep -qx .github/workflows/ci.yml; then files=all; fi
          # Files the docs quote, through --8<-- includes or fences titled with a path, belong to the
          # docs build too (scripts/check_doc_fences.py checks the titled ones against their source).
          quoted=$( { grep -rhoE -- '--8<-- "[^":]+' docs | cut -d '"' -f 2; grep -rhoE 'title="[^"()]+"' docs | cut -d '"' -f 2; } | grep -E '^[A-Za-z0-9_./-]+$' | sort -u | paste -sd '|' - || true)
          area() {
            # area <output> <regex>: true when a changed file matches
            if [ "$files" = all ] || printf '%s\n' "$files" | grep -qE "$2"; then hit=true; else hit=false; fi
            echo "$1=$hit" >> "$GITHUB_OUTPUT"
          }
          area python    '^(src|dlt_pipelines|scripts|tests)/|^(pyproject\.toml|uv\.lock|\.python-version)$'
          area dbt       '^(dbt|src|dlt_pipelines)/|^(workspace\.yaml|scripts/dbt_all\.py|pyproject\.toml|uv\.lock)$'
          area terraform '^terraform/|^(pyproject\.toml|uv\.lock)$'
          area docs      "^(docs|overrides)/|^(mkdocs\.yml|pyproject\.toml|uv\.lock|scripts/check_doc_fences\.py)$|^(${quoted})$"
          area setup     '^(justfile|\.env\.example|\.envrc|pyproject\.toml|uv\.lock|\.python-version)$|^scripts/|^dbt/[^/]+/(packages|package-lock)\.yml$'
          cat "$GITHUB_OUTPUT"

  python:
    name: Python (ruff, ty, pytest)
    needs: changes
    # Runs when the change touches this area, or when `changes` itself failed.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.python == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest

  dbt-and-dagster:
    name: dbt parse + Dagster definitions
    needs: changes
    # Runs when the change touches this area, or when `changes` itself failed.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.dbt == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked
      - run: uv run python scripts/dbt_all.py deps --quiet
      - run: uv run python scripts/dbt_all.py parse --target dummy --quiet
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      # The same projects through the dbt v2 parser, so they stay ready for the switch.
      - run: uv run python scripts/dbt_all.py parse --target dummy --quiet --use-v2-parser
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      # Every project under dbt/, the shared dbt_common package included.
      - run: |
          for project in dbt/*/dbt_project.yml; do
            (cd "${project%/*}" && uv run sqlfluff lint models --config ../.sqlfluff)
          done
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      - run: uv run dagster definitions validate -w workspace.yaml
        env:
          PYTHONWARNINGS: "ignore:Function `definitions_validate_command`"
          DBT_TARGET: dummy
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
          DAGSTER_HOME: ${{ github.workspace }}/.dagster
      # The step above loads each location on its own, so only this one sees a dlt key and the dbt
      # source that claims it drifting apart.
      - run: uv run python scripts/check_asset_keys.py
        env:
          DBT_TARGET: dummy
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
          DAGSTER_HOME: ${{ github.workspace }}/.dagster

  terraform:
    name: Terraform fmt + validate
    needs: changes
    # Runs when the change touches this area, or when `changes` itself failed.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.terraform == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # Pinned so `fmt -check` cannot start failing on a new release. Bump it deliberately.
          terraform_version: "1.15.5"
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked
      - run: uv run python terraform/config/_validation/validate_configs.py

  docs:
    name: Docs build
    needs: changes
    # Runs when the change touches this area, or when `changes` itself failed.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked --group docs
      - run: uv run python scripts/check_doc_fences.py
      - run: uv run --group docs zensical build --strict

  setup:
    # The engineer's path on a fresh machine, on every OS the docs support: `just init` (installs
    # uv when missing, .venv, .env, dbt deps), `just info`, `just check`, a key pair, and one
    # `just start` / `just stop` round trip. The steps run in bash everywhere (Git Bash on
    # Windows); `just` itself runs its recipes in PowerShell there, as on an engineer's machine.
    name: Setup (${{ matrix.os }})
    needs: changes
    # Runs when the change touches this area, or when `changes` itself failed.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.setup == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # No credentials here, so dbt talks to the in-memory DuckDB: every dbt invocation needs a
      # target it can reach with an empty SNOWFLAKE_USER. That is the `dbt parse` of `just init` and
      # `just check`, which writes the manifest the Dagster dbt locations build from, and the
      # re-parse `dagster dev` runs when it loads one. DBT_TARGET is unset in .env, so this reaches
      # dbt; a value .env does set would win over it.
      DBT_TARGET: dummy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: just init
      - run: just info
      - run: just check
      - run: just sf keygen ci
      - name: just start, wait for the UI, just stop
        # Output goes to a file: a background process holding the step's stdout keeps the step alive.
        run: |
          just start > dagster.log 2>&1 &
          for _ in $(seq 1 90); do curl -sf http://127.0.0.1:3000/server_info && break; sleep 2; done
          curl -sf http://127.0.0.1:3000/server_info || { cat dagster.log; exit 1; }
          # The webserver serves /server_info whatever the workspace does, so the log is what proves
          # the code locations loaded. `dagster dev` starts them before it binds the port.
          if grep -q "Error loading repository location" dagster.log; then cat dagster.log; exit 1; fi
          just stop
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:3000/server_info > /dev/null || break; sleep 1; done
          if curl -sf http://127.0.0.1:3000/server_info > /dev/null; then echo "still serving after just stop"; exit 1; fi
