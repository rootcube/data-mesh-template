version: 2

sources:
  - name: knmi
    description: >
      KNMI hourly weather observations, loaded into the source layer by the dlt pipeline
      `ingest_knmi` (dlt_pipelines/pipelines/ingest/knmi). Field names are the KNMI API codes,
      lowercased by dlt.
    # The source layer: _SRC, or <target.schema>_SRC in dev and local (DBT_SRC when it is blank).
    # Same rule and same target as dbt_common's generate_schema_name, spelled out here because
    # source YAML cannot call macros.
    schema: "{{ ((target.schema | trim | upper) or 'DBT') ~ '_SRC' if target.name | trim | lower in ['dev', 'local'] else '_SRC' }}"
    config:
      # `dbt source freshness` (job__dbt_example__source_freshness, hourly) compares the age of
      # MAX(loaded_at_field) with these. Defaults for every table of the source; a table's own
      # `freshness:` block overrides them, and a table without `loaded_at_field` is skipped.
      freshness:
        warn_after: {count: 48, period: hour}
        error_after: {count: 7, period: day}
    tables:
      - name: climate_hourly
        identifier: knmi__climate_hourly
        description: One row per station per hour (hour 1..24 = the hour ending at that time).
        config:
          # dlt stamps every row with its load id, the epoch seconds of the load, as text. Source
          # YAML cannot call macros, so the DuckDB spelling for the local target lives here too.
          loaded_at_field: "{{ 'TO_TIMESTAMP_NTZ(CAST(_dlt_load_id AS DECIMAL(20, 6)))' if target.type == 'snowflake' else 'CAST(TO_TIMESTAMP(CAST(_dlt_load_id AS DECIMAL(20, 6))) AS TIMESTAMP)' }}"
          meta:
            dagster:
              # Same key as the dlt asset, so the Dagster lineage runs dlt -> dbt.
              asset_key: ["dlt", "ingest", "knmi", "climate_hourly"]
        columns:
          - name: station_code
            description: KNMI station number (260 = De Bilt, 370 = Eindhoven, ...).
          - name: date
            description: Observation date.
          - name: hour
            description: Hour of the day, 1..24.
          - name: t
            description: Temperature at 1.50 m in 0.1 degrees Celsius.
          - name: fh
            description: Hourly mean wind speed in 0.1 m/s.
          - name: rh
            description: Hourly precipitation in 0.1 mm (-1 means less than 0.05 mm).
          - name: q
            description: Global radiation in J/cm2.
          - name: u
            description: Relative humidity in percent.
          - name: _dlt_load_id
            description: dlt load package that wrote the row.
