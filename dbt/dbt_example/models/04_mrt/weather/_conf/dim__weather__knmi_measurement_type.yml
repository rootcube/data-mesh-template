version: 2

models:
  - name: dim__weather__knmi_measurement_type
    description: Measurement type dimension, the KNMI variables the fact carries plus the unknown members.

    data_tests:
      - dbt_common.has_data:
          name: dim__weather__knmi_measurement_type__has_data

    columns:
      - name: id_dim__weather__knmi_measurement_type
        description: Surrogate key for the measurement type dimension, a hash of the KNMI variable code.
        data_type: varchar(40)
        data_tests:
          - not_null:
              name: dim__weather__knmi_measurement_type__id_dim__weather__knmi_measurement_type__not_null

          - unique:
              name: dim__weather__knmi_measurement_type__id_dim__weather__knmi_measurement_type__unique

      - name: measurement_type_code
        description: KNMI variable code (T, FH, RH, Q, U).
        data_type: varchar(10)
        data_tests:
          - not_null:
              name: dim__weather__knmi_measurement_type__measurement_type_code__not_null

          - unique:
              name: dim__weather__knmi_measurement_type__measurement_type_code__unique

      - name: measurement_type_name
        description: Name of the measurement type.
        data_type: varchar(50)
        data_tests:
          - not_null:
              name: dim__weather__knmi_measurement_type__measurement_type_name__not_null

      - name: measurement_type_desc
        description: What KNMI measures, as its documentation describes it.
        data_type: varchar(200)

      - name: unit
        description: Unit of the measurement value in the fact.
        data_type: varchar(10)

      - name: measurement_type_sort
        description: Sort order for displaying measurement types.
        data_type: integer

    constraints:
      - columns:
          - id_dim__weather__knmi_measurement_type
        type: primary_key
