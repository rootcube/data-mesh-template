version: 2

models:
  - name: int__weather__knmi_measurement
    description: >
      KNMI observations in long form, one row per station per hour per measurement type. The
      hourly staging row is unpivoted; hours without a value for a measurement have no row.

    data_tests:
      - dbt_common.has_data:
          name: int__weather__knmi_measurement__has_data

      - dbt_utils.unique_combination_of_columns:
          name: int__weather__knmi_measurement__station_code__observed_at__measurement_type_code__unique
          arguments:
            combination_of_columns: [station_code, observed_at, measurement_type_code]

    columns:
      - name: station_code
        description: KNMI station number.
        data_type: integer
        data_tests:
          - not_null:
              name: int__weather__knmi_measurement__station_code__not_null

      - name: observed_at
        description: End of the observation hour (timestamp, no timezone).
        data_type: timestamp_ntz
        data_tests:
          - not_null:
              name: int__weather__knmi_measurement__observed_at__not_null

      - name: measurement_type_code
        description: KNMI variable code (T, FH, RH, Q, U), see seed_knmi_measurement_type.
        data_type: varchar(10)
        data_tests:
          - not_null:
              name: int__weather__knmi_measurement__measurement_type_code__not_null

          - accepted_values:
              name: int__weather__knmi_measurement__measurement_type_code__accepted_values
              arguments:
                values: [T, FH, RH, Q, U]

      - name: measurement_value
        description: The measured value, in the unit of its measurement type.
        data_type: number(10,2)
        data_tests:
          - not_null:
              name: int__weather__knmi_measurement__measurement_value__not_null
