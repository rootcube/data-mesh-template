# Shared by every dbt project under dbt/ (DBT_PROFILES_DIR points here, set by the justfile
# and .envrc). One profile, one target per environment; the target follows ENVIRONMENT unless
# DBT_TARGET overrides it. Every Snowflake target reads the same SNOWFLAKE_* variables: your
# personal key pair in dev, the transform system user's key pair in tst, acc and prd.
default:
  target: "{{ env_var('DBT_TARGET', env_var('ENVIRONMENT', 'dev')) }}"

  outputs:
    # Local: a DuckDB file that dlt loads into and dbt builds in, no Snowflake needed
    # (ENVIRONMENT=local). Also what parses, compiles and lints without any credentials (CI,
    # pre-commit, sqlfluff). DUCKDB_PATH is set by the justfile, .envrc, scripts/dbt_all.py and
    # CI; the fallback is the same path relative to the working directory, which parses fine
    # but has no parent directory, so a command that connects fails instead of writing a stray
    # file (dbt's v2 parser rejects the in-memory `:memory:` spelling as a rendered value).
    # Personal-style schemas, <SNOWFLAKE_SCHEMA>_<LAYER>, DBT_<LAYER> when the prefix is blank.
    local:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '.duckdb/data/local.duckdb') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'DBT') }}"
      threads: 4

    # Development: personal schemas (<SNOWFLAKE_SCHEMA>_<LAYER>) in DB_<PROJECT>_DEV.
    dev: &snowflake
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', '') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', '') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', '') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'DBT') }}"
      threads: 8
      client_session_keep_alive: false

    # Shared environments: the layer schemas (_STG, _MRT, ...) of DB_<PROJECT>_TST, _ACC and _PRD.
    tst: &shared
      <<: *snowflake
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', '_TMP') }}"
      threads: 16

    acc:
      <<: *shared

    prd:
      <<: *shared
