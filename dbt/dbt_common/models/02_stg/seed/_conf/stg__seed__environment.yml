version: 2


models:
  - name: stg__seed__environment
    description: Collection of deployment environments (dev, tst, acc, prd)

    data_tests:
      - has_data:
          name: stg__seed__environment__has_data

      - rows_expected:
          name: stg__seed__environment__rows_expected
          arguments:
            value: 5

    columns:
      - name: environment_code
        description: Unique short code for the environment (e.g. dev, tst, acc, prd)
        data_type: varchar

        data_tests:
          - not_null:
              name: stg__seed__environment__environment_code__not_null

          - unique:
              name: stg__seed__environment__environment_code__unique

          - not_empty:
              name: stg__seed__environment__environment_code__not_empty

      - name: environment_name
        description: Full display name of the environment
        data_type: varchar

        data_tests:
          - not_null:
              name: stg__seed__environment__environment_name__not_null

          - unique:
              name: stg__seed__environment__environment_name__unique

          - not_empty:
              name: stg__seed__environment__environment_name__not_empty

      - name: environment_alias
        description: Alternative short name or alias for the environment
        data_type: varchar

      - name: environment_desc
        description: Longer description of the environment purpose
        data_type: varchar

      - name: environment_sort
        description: Sort order for display purposes
        data_type: integer

        data_tests:
          - not_negative:
              name: stg__seed__environment__environment_sort__not_negative
