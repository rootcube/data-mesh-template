version: 2


models:
  - name: int__generic__date
    description: Collection of Dates

    data_tests:
      - has_data:
          name: int__generic__date__has_data

    columns:
      - name: day
        description: 'Sequence number for the Day within the Date range'
        data_type: integer

        data_tests:
          - not_null:
              name: int__generic__date__day__not_null

          - unique:
              name: int__generic__date__day__unique

      - name: date
        description: 'Date in YYYY-MM-DD format'
        data_type: date

        data_tests:
          - not_null:
              name: int__generic__date__date__not_null

          - unique:
              name: int__generic__date__date__unique

      - name: date_time
        description: 'Timestamp for the Date at midnight (00:00:00)'
        data_type: timestamp

        data_tests:
          - not_null:
              name: int__generic__date__date_time__not_null

          - unique:
              name: int__generic__date__date_time__unique
