version: 2


models:
  - name: int__common__date
    description: >
      Collection of dates, one row per day. The window is a fixed first year plus a horizon of years past
      the current one, both meta configs of the installing project (dbt_project.yml):
      `calendar_start_year` (2000 by default) and `calendar_horizon_years` (10 by default). The first year
      is fixed on purpose, so a rebuild never drops the oldest year.

    data_tests:
      - has_data:
          name: int__common__date__has_data

    columns:
      - name: day
        description: 'Sequence number for the Day, counted from 1900-01-01'
        data_type: integer

        data_tests:
          - not_null:
              name: int__common__date__day__not_null

          - unique:
              name: int__common__date__day__unique

      - name: date
        description: 'Date in YYYY-MM-DD format'
        data_type: date

        data_tests:
          - not_null:
              name: int__common__date__date__not_null

          - unique:
              name: int__common__date__date__unique

      - name: date_time
        description: 'Timestamp for the Date at midnight (00:00:00)'
        data_type: timestamp

        data_tests:
          - not_null:
              name: int__common__date__date_time__not_null

          - unique:
              name: int__common__date__date_time__unique
