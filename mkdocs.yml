# Documentation site, built by Zensical from this MkDocs-format config. Local: `just docs` (http://localhost:8000).
site_name: Data Mesh Platform Starter
site_description: A runnable starter for a data mesh platform on Snowflake with Dagster, dlt and dbt.
# Where the built site is published, so canonical links and the sitemap are right.
site_url: https://rootcube.github.io/data-mesh-template/
repo_url: https://github.com/rootcube/data-mesh-template
repo_name: rootcube/data-mesh-template
edit_uri: edit/main/docs/
copyright: rootcube

theme:
  name: material
  # Template overrides (partials/tabs-item.html puts the page icons back in the tabs)
  custom_dir: overrides
  language: en
  # The rootcube.com faces; the colors live in stylesheets/extra.css
  font:
    text: Inter
    code: Fira Code
  logo: assets/icon-rootcube.svg
  favicon: assets/icon-rootcube.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

nav:
  - Home: index.md
  - Start:
      - start/index.md
      - Prerequisites: start/prerequisites.md
      - Installation: start/installation.md
      - Snowflake authentication: start/snowflake-auth.md
      - First run: start/first-run.md
      - Troubleshooting: start/troubleshooting.md
      - Making it yours: start/adopting.md
  - Build:
      - build/index.md
      - Adding a dlt load: build/adding-dlt-loads.md
      - Adding a dbt model: build/adding-dbt-models.md
      - Adding a project: build/adding-projects.md
      - Adding Python assets: build/adding-python-assets.md
      - Testing: build/testing.md
  - Operate:
      - operate/index.md
      - Snowflake provisioning: operate/snowflake-provisioning.md
      - Onboarding: operate/onboarding.md
      - Snowflake trial account: operate/snowflake-trial-account-setup.md
  - Understand:
      - understand/index.md
      - The platform model:
          - Organisation: understand/organisation.md
          - Team: understand/team.md
          - Project: understand/project.md
          - Environment: understand/environment.md
          - Layer: understand/layer.md
          - Role: understand/role.md
          - Access: understand/access.md
          - Compute: understand/compute.md
      - How it fits together:
          - Ingestion (dlt): understand/ingestion.md
          - Transformation (dbt): understand/transformation.md
          - Orchestration (Dagster): understand/orchestration.md
          - Snowflake: understand/snowflake.md
  - Reference:
      - reference/index.md
      - Conventions:
          - Python style: reference/python-style.md
          - SQL style: reference/sql-style.md
          - dbt style guide: reference/dbt-style-guide.md
          - Naming: reference/naming.md
          - Git workflow: reference/git-workflow.md
      - Commands: reference/commands.md
      - Environment variables: reference/environment-variables.md
      - Glossary: reference/glossary.md
      - For AI agents: reference/ai-agents.md
