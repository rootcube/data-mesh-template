# Install once with `just pre-commit-install`; run on everything with `just pre-commit`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--unsafe"] # dbt YAML carries {{ env_var() }} and dagster defs.yaml carries templates
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  # Python: ruff (format + lint) and ty (types), from this repo's venv.
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ty-check
        name: ty check
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false

  # dbt: every project must parse without credentials (local target); SQL follows the sqlfluff rules.
  # sqlfluff runs through its just recipe, which sets the working directory and DBT_PROFILES_DIR
  # on every OS (a Windows PATH has no bash or env).
  - repo: local
    hooks:
      - id: dbt-parse
        name: dbt parse (all projects, local target)
        entry: uv run python scripts/dbt_all.py parse --target local --quiet
        language: system
        files: ^dbt/.*\.(sql|yml|yaml|csv|py)$
        pass_filenames: false
      - id: dbt-parse-v2
        name: dbt parse with the v2 parser (all projects, local target)
        entry: uv run python scripts/dbt_all.py parse --target local --quiet --use-v2-parser
        language: system
        files: ^dbt/.*\.(sql|yml|yaml|csv|py)$
        pass_filenames: false

      - id: sqlfluff-lint
        name: sqlfluff lint (dbt_example models)
        entry: just sqlfluff lint models
        language: system
        files: ^dbt/dbt_example/models/.*\.sql$
        pass_filenames: false
      # One hook per project: each only fires when that project's models change.
      - id: sqlfluff-lint-common
        name: sqlfluff lint (dbt_common models)
        entry: just project=dbt_common sqlfluff lint models
        language: system
        files: ^dbt/dbt_common/models/.*\.sql$
        pass_filenames: false

  # Dagster: every code location must load (`just validate` sets the warning filter on every OS).
  - repo: local
    hooks:
      - id: dagster-validate
        name: dagster definitions validate
        entry: just validate
        language: system
        # dbt source YAML too: `just validate` also checks the dlt -> dbt asset key contract.
        files: ^(src|dlt_pipelines)/.*\.(py|yaml)$|^dbt/[^/]+/sources/.*\.ya?ml$
        pass_filenames: false

  # Terraform: formatting and the YAML configuration (only fire on those files).
  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -recursive terraform
        language: system
        files: \.tf$
        pass_filenames: false

      - id: validate-configs
        name: validate terraform/config YAML and the stack manifests
        entry: uv run python terraform/config/_validation/validate_configs.py
        language: system
        files: ^terraform/(config|stacks)/.*\.(yaml|json)$
        pass_filenames: false

  # Docs: a code fence titled with a repository path has to quote that file verbatim.
  - repo: local
    hooks:
      - id: check-doc-fences
        name: check titled code fences against their source files
        entry: uv run python scripts/check_doc_fences.py
        language: system
        files: ^docs/.*\.md$
        pass_filenames: false
