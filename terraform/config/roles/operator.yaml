      all:
        - USAGE
        - MODIFY
        - CREATE TABLE
        - CREATE VIEW
        - SELECT ON TABLES
        - INSERT ON TABLES
        - UPDATE ON TABLES
        - DELETE ON TABLES
        - TRUNCATE ON TABLES
        - SELECT ON VIEWS
    mart:
      all:
        - USAGE
        - MODIFY
        - CREATE TABLE
        - CREATE VIEW
        - SELECT ON TABLES
        - INSERT ON TABLES
        - UPDATE ON TABLES
        - DELETE ON TABLES
        - TRUNCATE ON TABLES
        - SELECT ON VIEWS
    expose:
      all:
        - USAGE
        - MODIFY
        - CREATE TABLE
        - CREATE VIEW
        - SELECT ON TABLES
        - INSERT ON TABLES
        - UPDATE ON TABLES
        - DELETE ON TABLES
        - TRUNCATE ON TABLES
        - SELECT ON VIEWS
    temporary:
      all:
        - USAGE
        - MODIFY
        - CREATE TABLE
        - CREATE VIEW
        - SELECT ON TABLES
        - INSERT ON TABLES
        - UPDATE ON TABLES
        - DELETE ON TABLES
        - TRUNCATE ON TABLES
        - SELECT ON VIEWS
  roles:
