# yaml-language-server: $schema=../_validation/schemas/role.schema.json
# Role: Analyst
# =============

code: "anl"
name: "Analyst"
type: "person"
level: "project"
desc: "Read-focused role for exploring and consuming data"
disabled: false
required: false

privileges:
  computes:
    default:
      all: [USAGE]
  layers:
    mart: {all: read}
    expose: {all: read}
    # Scratch space: `read` on the temporary layer also allows creating tables and views
    # (layers/temporary.yaml); the role owns what it creates and cannot write other roles' tables.
    temporary: {all: read}
