# yaml-language-server: $schema=../_validation/schemas/role.schema.json
# Role: Analyst
# =============

code: "anl"
name: "Analyst"
type: "person"
level: "project"
desc: "Read-focused role for exploring and consuming data"
disabled: false
required: false

privileges:
  computes:
    default:
      all: [USAGE]
  layers:
    mart:
      all:
        - USAGE
        - SELECT ON TABLES
        - SELECT ON VIEWS
        - USAGE ON FUNCTIONS
        - USAGE ON PROCEDURES
    expose:
      all:
        - USAGE
        - SELECT ON TABLES
        - SELECT ON VIEWS
        - USAGE ON FUNCTIONS
        - USAGE ON PROCEDURES
    # Scratch space: the role owns what it creates here, so it needs no write grants on the
    # tables of other roles (dlt's merge staging tables, dbt's stored test failures)
    temporary:
      all:
        - USAGE
        - CREATE TABLE
        - CREATE VIEW
        - SELECT ON TABLES
        - SELECT ON VIEWS
