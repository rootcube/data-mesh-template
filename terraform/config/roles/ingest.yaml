# yaml-language-server: $schema=../_validation/schemas/role.schema.json
# Role: Ingest
# ============

code: "ing"
name: "Ingest"
type: "system"
level: "project"
desc: "Used by ingestion tooling (e.g. dlt) to load data into the SRC layer"
disabled: false
required: true

privileges:
  computes:
    default:
      all: [USAGE, OPERATE]
    ingest:
      all: [USAGE, OPERATE]
  layers:
    source: {all: full}
    # dlt's staging tables for `merge` loads (staging_dataset_name_layout in dlt_pipelines/utils/destination.py):
    # `edit` on the temporary layer includes creating tables (layers/temporary.yaml).
    temporary: {all: edit}
