# yaml-language-server: $schema=../_validation/schemas/role.schema.json
# Role: Engineer
# ==============

code: "eng"
name: "Engineer"
type: "person"
level: "project"
desc: "Role for developing and maintaining ingestion and transformation pipelines"
disabled: false
required: true

# Personal schemas: in these environments every user holding this role (config/users) gets
# their own copy of each project layer, <PREFIX>_SRC, <PREFIX>_STG, ... (see personal.tf).
# Terraform creates them, owned by SYSADMIN, plus the user's own stage <PREFIX>_SRC.ST_DEFAULT;
# this role gets the privileges below on them. The role cannot create schemas itself.
personal:
  environments: [dev]
  privileges:
    - USAGE
    - MONITOR
    - MODIFY
    - CREATE TABLE
    - CREATE VIEW
    - CREATE MATERIALIZED VIEW
    - CREATE SEQUENCE
    - CREATE FUNCTION
    - CREATE PROCEDURE
    - CREATE FILE FORMAT
    - SELECT ON TABLES
    - INSERT ON TABLES
    - UPDATE ON TABLES
    - DELETE ON TABLES
    - TRUNCATE ON TABLES
    - SELECT ON VIEWS
    - USAGE ON FUNCTIONS
    - USAGE ON PROCEDURES
    - USAGE ON FILE FORMATS
    - READ ON STAGES
    - WRITE ON STAGES

privileges:
  computes:
    default:
      all: [USAGE, OPERATE, MONITOR]
    ingest:
      all: [USAGE, OPERATE, MONITOR]
    transform:
      all: [USAGE, OPERATE, MONITOR]
  layers:
    source:
      dev:
        - USAGE
        - MODIFY
        - CREATE TABLE
        - CREATE VIEW
        - SELECT ON TABLES
        - INSERT ON TABLES
        - UPDATE ON TABLES
        - DELETE ON TABLES
        - TRUNCATE ON TABLES
        - SELECT ON VIEWS
      tst:
        - USAGE
        - MODIFY
        - CREATE TABLE
        - CREATE VIEW
        - SELECT ON TABLES
        - INSERT ON TABLES
        - UPDATE ON TABLES
        - DELETE ON TABLES
        - TRUNCATE ON TABLES
        - SELECT ON VIEWS
      prd: [USAGE, SELECT ON TABLES, SELECT ON VIEWS]
    staging:
      dev:
        - USAGE
        - MODIFY
        - CREATE TABLE
        - CREATE VIEW
        - SELECT ON TABLES
        - INSERT ON TABLES
        - UPDATE ON TABLES
        - DELETE ON TABLES
        - TRUNCATE ON TABLES
        - SELECT ON VIEWS
      prd: [USAGE, SELECT ON TABLES, SELECT ON VIEWS]
    integration:
      dev:
        - USAGE
        - MODIFY
        - CREATE TABLE
        - CREATE VIEW
        - SELECT ON TABLES
        - INSERT ON TABLES
        - UPDATE ON TABLES
        - DELETE ON TABLES
        - TRUNCATE ON TABLES
        - SELECT ON VIEWS
      prd: [USAGE, SELECT ON TABLES, SELECT ON VIEWS]
    mart:
      dev:
        - USAGE
        - MODIFY
        - CREATE TABLE
        - CREATE VIEW
        - SELECT ON TABLES
        - INSERT ON TABLES
        - UPDATE ON TABLES
        - DELETE ON TABLES
        - TRUNCATE ON TABLES
        - SELECT ON VIEWS
      prd: [USAGE, SELECT ON TABLES, SELECT ON VIEWS]
    expose:
      dev:
        - USAGE
        - MODIFY
        - CREATE TABLE
        - CREATE VIEW
        - SELECT ON TABLES
        - INSERT ON TABLES
        - UPDATE ON TABLES
        - DELETE ON TABLES
        - TRUNCATE ON TABLES
        - SELECT ON VIEWS
      prd: [USAGE, SELECT ON TABLES, SELECT ON VIEWS]
    temporary:
      all:
        - USAGE
        - MODIFY
        - CREATE TABLE
        - CREATE VIEW
        - SELECT ON TABLES
        - INSERT ON TABLES
        - UPDATE ON TABLES
        - DELETE ON TABLES
        - TRUNCATE ON TABLES
        - SELECT ON VIEWS
    reference:
      dev:
        - USAGE
        - MODIFY
        - CREATE TABLE
        - CREATE VIEW
        - SELECT ON TABLES
        - INSERT ON TABLES
        - UPDATE ON TABLES
        - DELETE ON TABLES
        - TRUNCATE ON TABLES
        - SELECT ON VIEWS
      prd: [USAGE, SELECT ON TABLES, SELECT ON VIEWS]
    metadata:
      dev:
        - USAGE
        - MODIFY
        - CREATE TABLE
        - SELECT ON TABLES
        - INSERT ON TABLES
        - UPDATE ON TABLES
        - DELETE ON TABLES
        - TRUNCATE ON TABLES
      prd: [USAGE, SELECT ON TABLES]
  roles:
    transform: [dev, tst]
    ingest: [dev, tst]
    analyst: [all]
