        - INSERT ON TABLES
        - UPDATE ON TABLES
        - DELETE ON TABLES
        - TRUNCATE ON TABLES
        - SELECT ON VIEWS
      prd: [USAGE, SELECT ON TABLES, SELECT ON VIEWS]
    metadata:
      dev:
        - USAGE
        - MODIFY
        - CREATE TABLE
        - SELECT ON TABLES
        - INSERT ON TABLES
        - UPDATE ON TABLES
        - DELETE ON TABLES
        - TRUNCATE ON TABLES
      prd: [USAGE, SELECT ON TABLES]
  roles:
    transform: [dev, tst]
    ingest: [dev, tst]
    analyst: [all]
