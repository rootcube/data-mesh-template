# yaml-language-server: $schema=../_validation/schemas/role.schema.json
# Role: Engineer
# ==============

code: "eng"
name: "Engineer"
type: "person"
level: "project"
desc: "Role for developing and maintaining ingestion and transformation pipelines"
disabled: false
required: true

# Personal schemas: in these environments every user holding this role (config/users) gets
# their own copy of each project layer, <PREFIX>_SRC, <PREFIX>_STG, ... (see components/snowflake-project/personal.tf).
# Terraform creates them, owned by SYSADMIN, plus the user's own stage <PREFIX>_SRC.ST_DEFAULT;
# this role gets the `access` tier's privileges (config/accesses, plus the layer's extras) on
# them directly. The role cannot create schemas itself.
personal:
  environments: [dev]
  access: full

# Layers: one access tier (config/accesses: view, read, edit, full) per layer and environment,
# `all` as the fallback. The role inherits the matching access role AR_<PROJECT>_<ENV>__<LAYER>__<ACCESS>.
privileges:
  computes:
    default:
      all: [USAGE, OPERATE, MONITOR]
    ingest:
      all: [USAGE, OPERATE, MONITOR]
    transform:
      all: [USAGE, OPERATE, MONITOR]
  layers:
    source: {dev: full, tst: full, prd: read}
    reference: {dev: full, prd: read}
    staging: {dev: full, prd: read}
    integration: {dev: full, prd: read}
    mart: {dev: full, prd: read}
    expose: {dev: full, prd: read}
    metadata: {dev: full, prd: read}
    # Outside dev and tst only scratch space: `read` on the temporary layer also allows creating
    # tables and views (layers/temporary.yaml), and the role owns what it creates.
    temporary: {dev: full, tst: full, all: read}
  roles:
    transform: [dev, tst]
    ingest: [dev, tst]
    analyst: [all]
