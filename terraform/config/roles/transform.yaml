# yaml-language-server: $schema=../_validation/schemas/role.schema.json
# Role: Transform
# ===============

code: "tfm"
name: "Transform"
type: "system"
level: "project"
desc: "Used by transformation tooling (e.g. dbt) to read and write across layers"
disabled: false
required: true

privileges:
  computes:
    default:
      all: [USAGE, OPERATE]
    transform:
      all: [USAGE, OPERATE]
  layers:
    # `read` on the source layer includes READ and WRITE on its stages (layers/source.yaml):
    # dbt refreshes the load stage's directory table before every run.
    source: {all: read}
    reference: {all: full}
    staging: {all: full}
    integration: {all: full}
    mart: {all: full}
    expose: {all: full}
    metadata: {all: full}
    temporary: {all: full}
