# Dagster instance configuration for local development.
# DAGSTER_HOME points here (set by the justfile and .envrc), so run history, event logs
# and schedules land in this directory; everything but this file is git-ignored.

telemetry:
  enabled: false

# Runs start immediately in a subprocess, with no limit on concurrent runs; a limit needs the
# QueuedRunCoordinator and the daemon.
run_coordinator:
  module: dagster.core.run_coordinator
  class: DefaultRunCoordinator

run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher

# No `secrets:` block on purpose. .env reaches Dagster through `just` (set dotenv-load), which
# exports it into the `dagster dev` process; code servers and run subprocesses inherit that copy,
# so an edited .env needs `just stop && just start`. A secrets loader would not change this:
# DefaultRunLauncher starts runs inside the code server (core_execute_run with
# inject_env_vars=False), so the loader is never consulted per run, and dagster 1.13.24's
# EnvFileLoader looks for <base_dir>/.env/.env and finds nothing anyway.
